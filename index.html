<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Content Archive</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07101d;color:#edf4ff}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:20px}.hero{padding:26px;border:1px solid #263d5d;border-radius:18px;background:linear-gradient(135deg,#10243a,#0a1728)}h1{margin:0 0 8px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}input,select,button{padding:11px;border:1px solid #38506d;border-radius:9px;background:#101f33;color:#edf4ff}input{min-width:190px}button{cursor:pointer}.primary{background:#6de3ca;color:#06201b;font-weight:750}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.summary div,.card{padding:13px;border:1px solid #263d5d;border-radius:12px;background:#0b1728}.summary strong{display:block;font-size:22px}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:110px 1fr;gap:14px}.thumb{width:110px;aspect-ratio:9/12;object-fit:cover;border-radius:8px;background:#050b13}.meta{color:#9eb0c8;font-size:12px}.metrics{display:flex;gap:12px;flex-wrap:wrap;color:#70e6ce}.caption{line-height:1.45}.subtitle{white-space:pre-wrap;max-height:320px;overflow:auto;padding:12px;background:#07101d;border-radius:8px}details summary{cursor:pointer;color:#70e6ce}.splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#06101bea;backdrop-filter:blur(7px)}.splash[hidden]{display:none}.splash>div{width:min(520px,90vw);padding:28px;border:1px solid #38506d;border-radius:18px;background:#0c1728;text-align:center}.splash progress{width:100%;height:18px;accent-color:#70e6ce}@media(max-width:600px){.card{grid-template-columns:72px 1fr}.thumb{width:72px}.hero{padding:18px}main{padding:12px}}
</style></head><body><div id="splash" class="splash" hidden><div><h2>Menyinkronkan data terbaru</h2><p id="splashText">Menghubungkan ke Google Sheets…</p><progress></progress></div></div><main><section class="hero"><h1>TikTok Content Archive</h1><p>Dashboard baca dari Google Sheets. Data dikumpulkan oleh plugin; halaman ini tidak mengubah data.</p><div class="controls"><input id="endpoint" placeholder="URL Apps Script /exec"><input id="key" type="password" placeholder="Kode baca"><button id="connect" class="primary">Sambungkan & muat</button></div><div id="status">Belum tersambung.</div></section><div class="controls"><select id="account"><option value="all">Semua akun</option></select><select id="month"><option value="all">Semua bulan</option></select><select id="sort"><option value="views">Views terbanyak</option><option value="likes">Like terbanyak</option><option value="comments">Komentar terbanyak</option><option value="new">Tanggal terbaru</option></select><input id="min" inputmode="numeric" placeholder="Minimal views"><input id="search" placeholder="Cari caption, subtitle, atau ID"></div><section id="summary" class="summary"></section><p id="accountInfo"></p><section id="grid" class="grid"></section></main><script>
const $=id=>document.getElementById(id),state={accounts:[],videos:[]};$('endpoint').value=localStorage.getItem('tiktokSheetEndpoint')||'';$('key').value=localStorage.getItem('tiktokSheetReadKey')||'';
const fmt=n=>Number(n||0).toLocaleString('id-ID'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const a=$('account').value,m=$('month').value,q=$('search').value.toLowerCase(),minimum=Number($('min').value.replace(/\D/g,''))||0;let rows=state.videos.filter(v=>(a==='all'||v.username===a)&&(m==='all'||v.month===m)&&(Number(v.views)||0)>=minimum&&(!q||[v.caption,v.subtitle,v.id].some(x=>String(x||'').toLowerCase().includes(q))));const key=$('sort').value;rows.sort((x,y)=>key==='new'?String(y.date).localeCompare(String(x.date)):(Number(y[key])||0)-(Number(x[key])||0));const totals=rows.reduce((s,v)=>(s.views+=Number(v.views)||0,s.likes+=Number(v.likes)||0,s.comments+=Number(v.comments)||0,s),{views:0,likes:0,comments:0});$('summary').innerHTML=[['Video',rows.length],['Views',totals.views],['Like',totals.likes],['Komentar',totals.comments]].map(x=>`<div><strong>${fmt(x[1])}</strong>${x[0]}</div>`).join('');const meta=state.accounts.find(x=>x.username===a);$('accountInfo').textContent=meta?`Kategori: ${meta.category||'Tanpa kategori'} • ${meta.note||'Belum ada keterangan'}`:`${rows.length} video dari ${a==='all'?'semua akun':'@'+a}`;$('grid').innerHTML=rows.map(v=>`<article class="card"><img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(v.thumbnailUrl)}" onerror="this.style.visibility='hidden'"><div><div class="meta">@${esc(v.username)} • ${esc(v.date||'Tanggal tidak tersedia')} • ${esc(v.id)}</div><p class="caption">${esc(v.caption)}</p><div class="metrics"><span>Views ${fmt(v.views)}</span><span>Like ${fmt(v.likes)}</span><span>Komentar ${fmt(v.comments)}</span></div>${v.subtitle?`<details><summary>Baca subtitle</summary><pre class="subtitle">${esc(v.subtitle)}</pre></details>`:''}${v.url?`<p><a href="${esc(v.url)}" target="_blank" rel="noopener">Buka TikTok</a></p>`:''}</div></article>`).join('');}
function options(){const current=$('account').value;$('account').innerHTML='<option value="all">Semua akun</option>'+state.accounts.map(a=>`<option value="${esc(a.username)}">${esc(a.category||'Tanpa kategori')} — @${esc(a.username)}</option>`).join('');$('account').value=[...$('account').options].some(o=>o.value===current)?current:'all';const months=[...new Set(state.videos.map(v=>v.month).filter(Boolean))].sort().reverse();$('month').innerHTML='<option value="all">Semua bulan</option>'+months.map(m=>`<option>${esc(m)}</option>`).join('');}
async function load(showSplash=true){const endpoint=$('endpoint').value.trim(),key=$('key').value;if(!endpoint||!key){$('status').textContent='Masukkan URL Apps Script dan kode baca.';return;}localStorage.setItem('tiktokSheetEndpoint',endpoint);localStorage.setItem('tiktokSheetReadKey',key);if(showSplash){$('splash').hidden=false;$('splashText').textContent='Mengambil perubahan terbaru dari semua perangkat…';}$('status').textContent='Menyinkronkan Google Sheets…';try{const sep=endpoint.includes('?')?'&':'?',response=await fetch(endpoint+sep+'key='+encodeURIComponent(key)+'&_='+Date.now(),{cache:'no-store'}),data=await response.json();if(!data.ok)throw Error(data.error||'Akses ditolak');state.accounts=data.accounts||[];state.videos=data.videos||[];options();render();$('status').textContent=`Sinkron: ${state.accounts.length} akun, ${state.videos.length} video • ${new Date(data.generatedAt).toLocaleString('id-ID')}`;$('splashText').textContent='Data terbaru sudah sama.';if(showSplash)setTimeout(()=>$('splash').hidden=true,500);}catch(e){$('status').textContent='Gagal sinkron: '+e.message;$('splashText').textContent=$('status').textContent;if(showSplash)setTimeout(()=>$('splash').hidden=true,1800);}}
$('connect').onclick=()=>load(true);for(const id of ['account','month','sort','min','search'])$(id).oninput=render;if($('endpoint').value&&$('key').value)load(true);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('endpoint').value&&$('key').value)load(false);});setInterval(()=>{if(!document.hidden&&$('endpoint').value&&$('key').value)load(false);},60000);
</script></body></html>
