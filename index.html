<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Content Archive</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07101d;color:#edf4ff}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:20px}.hero{padding:26px;border:1px solid #263d5d;border-radius:18px;background:linear-gradient(135deg,#10243a,#0a1728)}h1{margin:0 0 8px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}input,select,button,.file{padding:11px;border:1px solid #38506d;border-radius:9px;background:#101f33;color:#edf4ff}input{min-width:190px}.file{cursor:pointer}.file input{display:none}button{cursor:pointer}.primary{background:#6de3ca;color:#06201b;font-weight:750}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.summary div,.card{padding:13px;border:1px solid #263d5d;border-radius:12px;background:#0b1728}.summary strong{display:block;font-size:22px}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:110px 1fr;gap:14px}.thumb{width:110px;aspect-ratio:9/12;object-fit:cover;border-radius:8px;background:#050b13}.meta{color:#9eb0c8;font-size:12px}.metrics{display:flex;gap:12px;flex-wrap:wrap;color:#70e6ce}.caption{line-height:1.45}.subtitle{white-space:pre-wrap;max-height:320px;overflow:auto;padding:12px;background:#07101d;border-radius:8px}details summary{cursor:pointer;color:#70e6ce}.splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#06101bea;backdrop-filter:blur(7px)}.splash[hidden]{display:none}.splash>div{width:min(520px,90vw);padding:28px;border:1px solid #38506d;border-radius:18px;background:#0c1728;text-align:center}.splash progress{width:100%;height:18px;accent-color:#70e6ce}.sheet-only[hidden],.xlsx-only[hidden]{display:none}@media(max-width:600px){.card{grid-template-columns:72px 1fr}.thumb{width:72px}.hero{padding:18px}main{padding:12px}}
</style></head><body><div id="splash" class="splash" hidden><div><h2>Menyinkronkan data terbaru</h2><p id="splashText">Menghubungkan ke Google Sheets…</p><progress></progress></div></div><main><section class="hero"><h1>TikTok Content Archive</h1><p>Pilih data Google Sheets yang tersinkron atau baca XLSX langsung hanya di perangkat ini.</p><div class="controls"><select id="dataSource"><option value="sheets">Sumber: Google Sheets</option><option value="xlsx">Sumber: XLSX lokal perangkat</option></select><span class="sheet-only"><input id="endpoint" placeholder="URL Apps Script /exec"><input id="key" type="password" placeholder="Kode baca"><button id="connect" class="primary">Sambungkan & muat</button><button id="forceReload">Muat ulang data dari nol</button></span><span class="xlsx-only" hidden><label class="file">Pilih satu/banyak XLSX<input id="xlsxFiles" type="file" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><button id="clearXlsx">Hapus data XLSX perangkat</button></span></div><div id="status">Belum tersambung.</div></section><div class="controls"><select id="account"><option value="all">Semua akun</option></select><select id="month"><option value="all">Semua bulan</option></select><select id="sort"><option value="views">Views terbanyak</option><option value="likes">Like terbanyak</option><option value="comments">Komentar terbanyak</option><option value="new">Tanggal terbaru</option></select><input id="min" inputmode="numeric" placeholder="Minimal views"><input id="search" placeholder="Cari caption, subtitle, atau ID"></div><section id="summary" class="summary"></section><p id="accountInfo"></p><section id="grid" class="grid"></section></main><script type="module">
import {readLocalXlsx} from './xlsx-local.js';
const $=id=>document.getElementById(id),state={accounts:[],videos:[],revision:Number(localStorage.getItem('tiktokSheetRevision'))||0};$('endpoint').value=localStorage.getItem('tiktokSheetEndpoint')||'';$('key').value=localStorage.getItem('tiktokSheetReadKey')||'';let cacheReady=false;function cacheDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('TikTokArchiveCloud',1);r.onupgradeneeded=()=>r.result.createObjectStore('cache');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}async function cacheGet(){try{const d=await cacheDb(),v=await new Promise((resolve,reject)=>{const r=d.transaction('cache').objectStore('cache').get('archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});d.close();return v;}catch{return null;}}async function cachePut(v){try{const d=await cacheDb();await new Promise((resolve,reject)=>{const tx=d.transaction('cache','readwrite');tx.objectStore('cache').put(v,'archive');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});d.close();}catch{}}async function cacheClear(){try{const d=await cacheDb();await new Promise((resolve,reject)=>{const tx=d.transaction('cache','readwrite');tx.objectStore('cache').delete('archive');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});d.close();}catch{}localStorage.removeItem('tiktokSheetRevision');state.accounts=[];state.videos=[];state.revision=0;cacheReady=true;}async function restoreCache(){if(cacheReady)return;cacheReady=true;const cached=await cacheGet();if(cached){state.accounts=cached.accounts||[];state.videos=cached.videos||[];state.revision=Number(cached.revision)||state.revision;options();render();$('status').textContent=`Mode offline: ${state.videos.length} video tersimpan.`;}}
async function localXlsxCacheGet(){try{const d=await cacheDb(),v=await new Promise((resolve,reject)=>{const r=d.transaction('cache').objectStore('cache').get('xlsxArchive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});d.close();return v;}catch{return null;}}
async function localXlsxCachePut(v){const d=await cacheDb();await new Promise((resolve,reject)=>{const tx=d.transaction('cache','readwrite');tx.objectStore('cache').put(v,'xlsxArchive');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});d.close();}
async function localXlsxCacheClear(){try{const d=await cacheDb();await new Promise((resolve,reject)=>{const tx=d.transaction('cache','readwrite');tx.objectStore('cache').delete('xlsxArchive');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});d.close();}catch{}}
function accountsFromVideos(videos){const names=[...new Set(videos.map(v=>v.username).filter(Boolean))];return names.map(username=>({username,category:'XLSX lokal',note:'Data dibaca langsung dari file pada perangkat ini.'}));}
async function restoreLocalXlsx(){const cached=await localXlsxCacheGet();state.accounts=cached?.accounts||[];state.videos=cached?.videos||[];state.revision=0;options();render();$('status').textContent=state.videos.length?`XLSX lokal dipulihkan: ${state.videos.length} video dari ${state.accounts.length} akun.`:'Pilih satu atau beberapa XLSX dari perangkat.';}
function updateSourceUi(){const local=$('dataSource').value==='xlsx';document.querySelector('.sheet-only').hidden=local;document.querySelector('.xlsx-only').hidden=!local;localStorage.setItem('tiktokDashboardDataSource',local?'xlsx':'sheets');}
async function importLocalFiles(files){if(!files.length)return;$('splash').hidden=false;const bar=$('splash').querySelector('progress'),map=new Map();let completed=0,thumbnailDone=0,thumbnailTotal=0;try{for(const file of files){$('splashText').textContent=`Membaca XLSX ${completed+1}/${files.length}: ${file.name}`;bar.value=completed/Math.max(1,files.length);const videos=await readLocalXlsx(file,(stage,done,total)=>{if(stage==='thumbnail'){thumbnailDone=done;thumbnailTotal=total;$('splashText').textContent=`${file.name} • thumbnail ${done}/${Math.max(1,total)}`;bar.value=(completed+(total?done/total:0))/files.length;}});for(const video of videos)map.set((video.username||'xlsx')+':'+video.id,video);completed++;}const previous=await localXlsxCacheGet();for(const video of previous?.videos||[])if(!map.has((video.username||'xlsx')+':'+video.id))map.set((video.username||'xlsx')+':'+video.id,video);state.videos=[...map.values()];state.accounts=accountsFromVideos(state.videos);state.revision=0;await localXlsxCachePut({accounts:state.accounts,videos:state.videos,importedAt:new Date().toISOString()});options();render();bar.value=1;$('splashText').textContent=`Selesai: ${state.videos.length} video tersimpan di perangkat.`;$('status').textContent=`Impor XLSX lokal selesai • ${files.length} file • ${state.accounts.length} akun • ${state.videos.length} video${thumbnailTotal?` • thumbnail terakhir ${thumbnailDone}/${thumbnailTotal}`:''}.`;setTimeout(()=>$('splash').hidden=true,700);}catch(e){$('status').textContent='Impor XLSX gagal: '+e.message;$('splashText').textContent=$('status').textContent;setTimeout(()=>$('splash').hidden=true,1800);}}
const fmt=n=>Number(n||0).toLocaleString('id-ID'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const a=$('account').value,m=$('month').value,q=$('search').value.toLowerCase(),minimum=Number($('min').value.replace(/\D/g,''))||0;let rows=state.videos.filter(v=>(a==='all'||v.username===a)&&(m==='all'||v.month===m)&&(Number(v.views)||0)>=minimum&&(!q||[v.caption,v.subtitle,v.id].some(x=>String(x||'').toLowerCase().includes(q))));const key=$('sort').value;rows.sort((x,y)=>key==='new'?String(y.date).localeCompare(String(x.date)):(Number(y[key])||0)-(Number(x[key])||0));const totals=rows.reduce((s,v)=>(s.views+=Number(v.views)||0,s.likes+=Number(v.likes)||0,s.comments+=Number(v.comments)||0,s),{views:0,likes:0,comments:0});$('summary').innerHTML=[['Video',rows.length],['Views',totals.views],['Like',totals.likes],['Komentar',totals.comments]].map(x=>`<div><strong>${fmt(x[1])}</strong>${x[0]}</div>`).join('');const meta=state.accounts.find(x=>x.username===a);$('accountInfo').textContent=meta?`Kategori: ${meta.category||'Tanpa kategori'} • ${meta.note||'Belum ada keterangan'}`:`${rows.length} video dari ${a==='all'?'semua akun':'@'+a}`;$('grid').innerHTML=rows.map(v=>`<article class="card"><img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(v.thumbnailData||v.thumbnailUrl)}" onerror="if(this.dataset.fallback){this.style.visibility='hidden'}else{this.dataset.fallback='1';this.src='${esc(v.thumbnailUrl)}'}"><div><div class="meta">@${esc(v.username)} • ${esc(v.date||'Tanggal tidak tersedia')} • ${esc(v.id)}</div><p class="caption">${esc(v.caption)}</p><div class="metrics"><span>Views ${fmt(v.views)}</span><span>Like ${fmt(v.likes)}</span><span>Komentar ${fmt(v.comments)}</span></div>${v.subtitle?`<details><summary>Baca subtitle</summary><pre class="subtitle">${esc(v.subtitle)}</pre></details>`:''}${v.url?`<p><a href="${esc(v.url)}" target="_blank" rel="noopener">Buka TikTok</a></p>`:''}</div></article>`).join('');}
function options(){const currentAccount=$('account').value||localStorage.getItem('tiktokDashboardAccount')||'all',currentMonth=$('month').value!=='all'?$('month').value:(localStorage.getItem('tiktokDashboardMonth')||'all');$('account').innerHTML='<option value="all">Semua akun</option>'+state.accounts.map(a=>`<option value="${esc(a.username)}">${esc(a.category||'Tanpa kategori')} — @${esc(a.username)}</option>`).join('');$('account').value=[...$('account').options].some(o=>o.value===currentAccount)?currentAccount:'all';const months=[...new Set(state.videos.map(v=>v.month).filter(Boolean))].sort().reverse();$('month').innerHTML='<option value="all">Semua bulan</option>'+months.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');$('month').value=months.includes(currentMonth)?currentMonth:'all';localStorage.setItem('tiktokDashboardAccount',$('account').value);localStorage.setItem('tiktokDashboardMonth',$('month').value);}
async function load(showSplash=true,force=false){const scrollTop=window.scrollY;await restoreCache();if(force)await cacheClear();const endpoint=$('endpoint').value.trim(),key=$('key').value,splashBar=$('splash').querySelector('progress');if(!endpoint||!key){$('status').textContent='Masukkan URL Apps Script dan kode baca.';return;}localStorage.setItem('tiktokSheetEndpoint',endpoint);localStorage.setItem('tiktokSheetReadKey',key);if(state.videos.length){options();render();if(!showSplash)requestAnimationFrame(()=>window.scrollTo({top:scrollTop,behavior:'instant'}));$('status').textContent=`Mode offline: ${state.videos.length} video tersimpan. Memeriksa perubahan…`;}if(showSplash){$('splash').hidden=false;splashBar.value=.08;$('splashText').textContent=force?'Tahap 1/3 • Mengosongkan cache perangkat…':'Tahap 1/3 • Memeriksa versi Google Sheets…';}try{const sep=endpoint.includes('?')?'&':'?',base=endpoint+sep+'key='+encodeURIComponent(key);let changed=force;if(!force){const check=await (await fetch(base+'&check=1&sinceRevision='+state.revision+'&_='+Date.now(),{cache:'no-store'})).json();if(!check.ok)throw Error(check.error||'Akses ditolak');changed=check.changed;if(!changed&&state.videos.length===0&&state.revision>0){await cacheClear();changed=true;}}if(!changed){$('status').textContent=`Data sudah sama • revisi ${state.revision} • ${state.videos.length} video dari cache offline`;if(showSplash){splashBar.value=1;$('splashText').textContent='Tidak ada perubahan. Unduhan dilewati.';setTimeout(()=>$('splash').hidden=true,550);}return;}if(showSplash){splashBar.value=.42;$('splashText').textContent=force?'Tahap 2/3 • Mengambil ulang seluruh data Google Sheets…':`Tahap 2/3 • Mengambil perubahan setelah revisi ${state.revision}…`;}const data=await (await fetch(base+'&sinceRevision='+state.revision+'&_='+Date.now(),{cache:'no-store'})).json();if(!data.ok)throw Error(data.error||'Akses ditolak');const accountMap=new Map(state.accounts.map(x=>[x.username,x]));for(const x of data.accounts||[])accountMap.set(x.username,x);const videoMap=new Map(state.videos.map(x=>[x.username+':'+x.id,x]));for(const x of data.videos||[])videoMap.set(x.username+':'+x.id,x);state.accounts=[...accountMap.values()];state.videos=[...videoMap.values()];state.revision=Number(data.revision)||0;localStorage.setItem('tiktokSheetRevision',String(state.revision));await cachePut({accounts:state.accounts,videos:state.videos,revision:state.revision});$('splashText').textContent=`Tahap 3/3 • Menampilkan ${state.videos.length} video…`;splashBar.value=.84;options();render();if(!showSplash)requestAnimationFrame(()=>window.scrollTo({top:scrollTop,behavior:'instant'}));$('status').textContent=`${force?'Pemuatan ulang lengkap selesai':'Sinkron selesai'} • revisi ${state.revision} • ${state.accounts.length} akun, ${state.videos.length} video`;if(showSplash){splashBar.value=1;setTimeout(()=>$('splash').hidden=true,600);}}catch(e){$('status').textContent=`Mode offline aktif: ${state.videos.length} video tersimpan • sinkron tertunda: ${e.message}`;$('splashText').textContent=$('status').textContent;if(showSplash)setTimeout(()=>$('splash').hidden=true,1800);}}
$('connect').onclick=()=>load(true);$('forceReload').onclick=()=>{if(confirm('Muat ulang seluruh data dari Google Sheets? Cache perangkat akan dibuat ulang, tetapi data Google Sheets tidak dihapus.'))load(true,true);};$('xlsxFiles').onchange=async()=>{const files=[...($('xlsxFiles').files||[])];$('xlsxFiles').value='';await importLocalFiles(files);};$('clearXlsx').onclick=async()=>{if(!confirm('Hapus data XLSX yang tersimpan hanya di perangkat ini? File asli tidak akan dihapus.'))return;await localXlsxCacheClear();state.accounts=[];state.videos=[];state.revision=0;options();render();$('status').textContent='Cache XLSX perangkat sudah dihapus.';};$('dataSource').onchange=async()=>{updateSourceUi();if($('dataSource').value==='xlsx')await restoreLocalXlsx();else{const cached=await cacheGet();state.accounts=cached?.accounts||[];state.videos=cached?.videos||[];state.revision=Number(cached?.revision)||Number(localStorage.getItem('tiktokSheetRevision'))||0;options();render();$('status').textContent=state.videos.length?`Cache Google Sheets dipulihkan: ${state.videos.length} video.`:'Belum ada cache Google Sheets.';if($('endpoint').value&&$('key').value)load(true);}};for(const id of ['account','month','sort','min','search'])$(id).oninput=()=>{if(id==='account')localStorage.setItem('tiktokDashboardAccount',$('account').value);if(id==='month')localStorage.setItem('tiktokDashboardMonth',$('month').value);render();};(async()=>{$('dataSource').value=localStorage.getItem('tiktokDashboardDataSource')==='xlsx'?'xlsx':'sheets';updateSourceUi();if($('dataSource').value==='xlsx')await restoreLocalXlsx();else{await restoreCache();if($('endpoint').value&&$('key').value)load(true);}})();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('dataSource').value==='sheets'&&$('endpoint').value&&$('key').value)load(false);});setInterval(()=>{if(!document.hidden&&$('dataSource').value==='sheets'&&$('endpoint').value&&$('key').value)load(false);},60000);
</script></body></html>
