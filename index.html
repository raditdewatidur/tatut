saves)}</span><span>Share ${fmt(v.shares)}</span><span>Durasi asli ${formatDuration(v.durationSeconds)}</span><span>Estimasi sub ${estimate?'± '+formatDuration(estimate):'—'}</span></div>${subtitle?`<details><summary>Baca subtitle</summary><pre class="subtitle">${esc(subtitle)}</pre></details>`:'<p class="meta">Subtitle belum tersedia; estimasi durasi belum dapat dihitung.</p>'}<div class="controls"><button class="edit-subtitle">${subtitle?'Edit subtitle':'Tambah subtitle'}</button></div><div class="subtitle-editor" hidden><textarea rows="10" placeholder="Tulis atau tempel subtitle tanpa timestamp">${esc(subtitle)}</textarea><div><button class="save-subtitle primary">Simpan subtitle</button><button class="cancel-subtitle">Batal</button></div></div>${v.url?`<p><a href="${esc(v.url)}" target="_blank" rel="noopener">Buka TikTok</a></p>`:''}</div></article>`;}).join('');for(const card of $('grid').querySelectorAll('.card')){const video=rows[Number(card.dataset.index)],editor=card.querySelector('.subtitle-editor'),textarea=editor.querySelector('textarea'),edit=card.querySelector('.edit-subtitle');edit.onclick=()=>{editor.hidden=!editor.hidden;if(!editor.hidden)textarea.focus();};card.querySelector('.cancel-subtitle').onclick=()=>editor.hidden=true;card.querySelector('.save-subtitle').onclick=async event=>{event.currentTarget.disabled=true;try{const saved=await saveSubtitleEdit(video,textarea.value),scroll=window.scrollY;video.subtitle=saved;$('status').textContent=`Subtitle ${video.id} disimpan di perangkat; estimasi durasi diperbarui dan akan digunakan saat export.`;render();requestAnimationFrame(()=>window.scrollTo({top:scroll,behavior:'instant'}));}catch(e){$('status').textContent='Subtitle gagal disimpan: '+e.message;}finally{event.currentTarget.disabled=false;}};}}
function options(){const currentAccount=$('account').value||localStorage.getItem('tiktokDashboardAccount')||'all',currentMonth=$('month').value!=='all'?$('month').value:(localStorage.getItem('tiktokDashboardMonth')||'all');$('account').innerHTML='<option value="all">Semua akun</option>'+state.accounts.map(a=>`<option value="${esc(a.username)}">${esc(a.category||'Tanpa kategori')} — @${esc(a.username)}</option>`).join('');$('account').value=[...$('account').options].some(o=>o.value===currentAccount)?currentAccount:'all';const months=[...new Set(state.videos.map(v=>v.month).filter(Boolean))].sort().reverse();$('month').innerHTML='<option value="all">Semua bulan</option>'+months.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');$('month').value=months.includes(currentMonth)?currentMonth:'all';localStorage.setItem('tiktokDashboardAccount',$('account').value);localStorage.setItem('tiktokDashboardMonth',$('month').value);}
async function load(showSplash=true,force=false){const scrollTop=window.scrollY;await restoreCache();if(force)await cacheClear();const endpoint=$('endpoint').value.trim(),key=$('key').value,splashBar=$('splash').querySelector('progress');if(!endpoint||!key){$('status').textContent='Masukkan URL Apps Script dan kode baca.';return;}localStorage.setItem('tiktokSheetEndpoint',endpoint);localStorage.setItem('tiktokSheetReadKey',key);if(state.videos.length){options();render();if(!showSplash)requestAnimationFrame(()=>window.scrollTo({top:scrollTop,behavior:'instant'}));$('status').textContent=`Mode offline: ${state.videos.length} video tersimpan. Memeriksa perubahan…`;}if(showSplash){$('splash').hidden=false;splashBar.value=.08;$('splashText').textContent=force?'Tahap 1/3 • Mengosongkan cache perangkat…':'Tahap 1/3 • Memeriksa versi Google Sheets…';}try{const sep=endpoint.includes('?')?'&':'?',base=endpoint+sep+'key='+encodeURIComponent(key);let changed=force;if(!force){const check=await (await fetch(base+'&check=1&sinceRevision='+state.revision+'&_='+Date.now(),{cache:'no-store'})).json();if(!check.ok)throw Error(check.error||'Akses ditolak');changed=check.changed;if(!changed&&state.videos.length===0&&state.revision>0){await cacheClear();changed=true;}}if(!changed){$('status').textContent=`Data sudah sama • revisi ${state.revision} • ${state.videos.length} video dari cache offline`;if(showSplash){splashBar.value=1;$('splashText').textContent='Tidak ada perubahan. Unduhan dilewati.';setTimeout(()=>$('splash').hidden=true,550);}return;}if(showSplash){splashBar.value=.42;$('splashText').textContent=force?'Tahap 2/3 • Mengambil ulang seluruh data Google Sheets…':`Tahap 2/3 • Mengambil perubahan setelah revisi ${state.revision}…`;}const data=await (await fetch(base+'&sinceRevision='+state.revision+'&_='+Date.now(),{cache:'no-store'})).json();if(!data.ok)throw Error(data.error||'Akses ditolak');const accountMap=new Map(state.accounts.map(x=>[x.username,x]));for(const x of data.accounts||[])accountMap.set(x.username,x);const videoMap=new Map(state.videos.map(x=>[x.username+':'+x.id,x]));for(const x of data.videos||[])videoMap.set(x.username+':'+x.id,x);state.accounts=[...accountMap.values()];state.videos=[...videoMap.values()];state.revision=Number(data.revision)||0;localStorage.setItem('tiktokSheetRevision',String(state.revision));await cachePut({accounts:state.accounts,videos:state.videos,revision:state.revision});$('splashText').textContent=`Tahap 3/3 • Menampilkan ${state.videos.length} video…`;splashBar.value=.84;options();render();if(!showSplash)requestAnimationFrame(()=>window.scrollTo({top:scrollTop,behavior:'instant'}));$('status').textContent=`${force?'Pemuatan ulang lengkap selesai':'Sinkron selesai'} • revisi ${state.revision} • ${state.accounts.length} akun, ${state.videos.length} video`;if(showSplash){splashBar.value=1;setTimeout(()=>$('splash').hidden=true,600);}}catch(e){$('status').textContent=`Mode offline aktif: ${state.videos.length} video tersimpan • sinkron tertunda: ${e.message}`;$('splashText').textContent=$('status').textContent;if(showSplash)setTimeout(()=>$('splash').hidden=true,1800);}}
$('exportXlsx').onclick=()=>{const source=$('exportScope').value==='filter'?filteredRows():state.videos,rows=source.map(video=>({...video,subtitle:effectiveSubtitle(video),estimatedDurationSeconds:estimatedDuration(video)}));if(!rows.length){$('status').textContent='Tidak ada data yang dapat diekspor.';return;}const bytes=exportDashboardXlsx(rows),url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a'),date=new Date().toISOString().slice(0,10).replaceAll('-','');a.href=url;a.download=`TikTok_Dashboard_${$('exportScope').value==='filter'?'Hasil_Filter':'Semua_Data'}_${date}.xlsx`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent=`Export selesai: ${rows.length} video • subtitle, durasi asli, dan estimasi durasi sudah disertakan.`;};
$('connect').onclick=()=>load(true);$('forceReload').onclick=()=>{if(confirm('Muat ulang seluruh data dari Google Sheets? Cache perangkat akan dibuat ulang, tetapi data Google Sheets tidak dihapus.'))load(true,true);};$('xlsxFiles').onchange=async()=>{const files=[...($('xlsxFiles').files||[])];$('xlsxFiles').value='';if(!files.length)return;try{const job=await stageLocalXlsx(files,$('xlsxImportMode').value),staged=await restoreLocalImportFiles(job);await importLocalFiles(staged,job);}catch(e){$('status').textContent='Gagal menyimpan antrean XLSX internal: '+e.message;}};$('clearXlsx').onclick=async()=>{if(!confirm('Hapus data XLSX yang tersimpan hanya di perangkat ini? File asli tidak akan dihapus.'))return;const job=await localImportValue('xlsxImportJob');if(job)await cleanupLocalImport(job);await localXlsxCacheClear();state.accounts=[];state.videos=[];state.revision=0;options();render();$('status').textContent='Cache XLSX perangkat dan antrean impor sudah dihapus.';};$('dataSource').onchange=async()=>{updateSourceUi();if($('dataSource').value==='xlsx'){await restoreLocalXlsx();await resumeLocalXlsxImport();}else{const cached=await cacheGet();state.accounts=cached?.accounts||[];state.videos=cached?.videos||[];state.revision=Number(cached?.revision)||Number(localStorage.getItem('tiktokSheetRevision'))||0;options();render();$('status').textContent=state.videos.length?`Cache Google Sheets dipulihkan: ${state.videos.length} video.`:'Belum ada cache Google Sheets.';if($('endpoint').value&&$('key').value)load(true);}};for(const id of ['account','month','sort','min','search'])$(id).oninput=()=>{if(id==='account')localStorage.setItem('tiktokDashboardAccount',$('account').value);if(id==='month')localStorage.setItem('tiktokDashboardMonth',$('month').value);render();};(async()=>{await restoreSubtitleEdits();$('dataSource').value=localStorage.getItem('tiktokDashboardDataSource')==='xlsx'?'xlsx':'sheets';updateSourceUi();if($('dataSource').value==='xlsx'){await restoreLocalXlsx();await resumeLocalXlsxImport();}else{await restoreCache();if($('endpoint').value&&$('key').value)load(true);}})();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('dataSource').value==='sheets'&&$('endpoint').value&&$('key').value)load(false);});setInterval(()=>{if(!document.hidden&&$('dataSource').value==='sheets'&&$('endpoint').value&&$('key').value)load(false);},60000);
</script></body></html>
